<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Teletalk AutoFill</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>


<h2><img src="icon.png" alt="" height="32px" width="32px" style="vertical-align: middle; margin-right: 8px;"> Teletalk AutoFill</h2>

<div class="subtitle">
    Version 3.5
</div>

<div class="card">

    <label>Active Profile</label>

    <select id="profileSelect"></select>

    <div id="mobileInfo"></div>

    <div id="emailInfo"></div>

<div class="button-group">
    <button id="fillBtn">
        ⚡ AUTO FILL

    <button id="createProfileBtn">
        ➕ Create Profile
    </button>
</div>

<div class="footer">
    Made by Saroar Hossain Emon
</div>
